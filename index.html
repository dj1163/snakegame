<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modo Snake Game</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 90vw;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        canvas {
            width: 100%;
            height: 100%;
            background-color: #000;
            display: block;
        }
        #score-board {
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: bold;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
            overflow-y: auto;
            padding: 20px;
        }
        h1 { margin-bottom: 20px; font-size: 32px; margin-top: 0; }
        h2 { margin-bottom: 15px; font-size: 20px; margin-top: 0; }
        button {
            padding: 15px 40px;
            font-size: 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px #2e6031;
            margin: 8px;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px #2e6031;
        }
        button:hover {
            background-color: #45a049;
        }
        #leaderboard {
            width: 100%;
            max-width: 300px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            text-align: left;
        }
        .leaderboard-entry {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 14px;
        }
        .leaderboard-entry:last-child {
            border-bottom: none;
        }
        .leaderboard-rank {
            font-weight: bold;
            min-width: 30px;
        }
        .leaderboard-name {
            flex: 1;
            margin: 0 10px;
            word-break: break-all;
        }
        .leaderboard-score {
            font-weight: bold;
            color: #4CAF50;
        }
        #name-input-container {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 250px;
        }
        #player-name {
            padding: 12px;
            font-size: 16px;
            border: 2px solid #4CAF50;
            border-radius: 5px;
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            text-align: center;
        }
        #player-name::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        #button-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .small-button {
            padding: 10px 20px;
            font-size: 14px;
        }
        p {
            margin-top: 15px;
            margin-bottom: 0;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>

    <div id="score-board">Score: 0</div>
    
    <div id="game-container">
        <div id="overlay">
            <h1 id="status-text">Modo Snake Game</h1>
            <button id="startBtn">START GAME</button>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <p style="font-size: 14px; margin-top: 15px; color: #888;">Swipe or use arrow keys to move</p>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score-board");
        const overlay = document.getElementById("overlay");
        const statusText = document.getElementById("status-text");
        const startBtn = document.getElementById("startBtn");

        const gridSize = 20;
        canvas.width = 400;
        canvas.height = 400;

        let score = 0;
        let snake = [];
        let food = {x: 0, y: 0};
        let dx = 0;
        let dy = 0;
        let nextDx = 0;
        let nextDy = 0;
        let gameRunning = false;
        let gameLoopTimeout;
        let logoLoaded = false;
        let playerName = "Player";

        const HIGH_SCORES_KEY = "snakeGameHighScores";

        // Load Modo logo as SVG
        const logoSvg = new Image();
        logoSvg.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 560 400'%3E%3Crect x='0' y='150' width='120' height='120' fill='%23C41E3A' transform='rotate(-45 60 210[...]";
        logoSvg.onload = () => {
            logoLoaded = true;
            console.log("Modo logo loaded successfully");
        };
        logoSvg.onerror = () => {
            logoLoaded = false;
            console.log("Failed to load Modo logo, will use red square");
        };

        // High Score Management
        function getHighScores() {
            const scores = localStorage.getItem(HIGH_SCORES_KEY);
            return scores ? JSON.parse(scores) : [];
        }

        function saveHighScores(scores) {
            localStorage.setItem(HIGH_SCORES_KEY, JSON.stringify(scores));
        }

        function addHighScore(name, score) {
            let scores = getHighScores();
            scores.push({ name: name || "Player", score: score });
            scores.sort((a, b) => b.score - a.score);
            scores = scores.slice(0, 10); // Keep only top 10
            saveHighScores(scores);
            return scores;
        }

        function isHighScore(score) {
            const scores = getHighScores();
            if (scores.length < 10) return true;
            return score > scores[scores.length - 1].score;
        }

        function displayLeaderboard() {
            const scores = getHighScores();
            let leaderboardHtml = '<div id="leaderboard"><h2>TOP 10 SCORES</h2>';
            
            if (scores.length === 0) {
                leaderboardHtml += '<div class="leaderboard-entry">No scores yet. Start playing!</div>';
            } else {
                scores.forEach((entry, index) => {
                    leaderboardHtml += `
                        <div class="leaderboard-entry">
                            <span class="leaderboard-rank">#${index + 1}</span>
                            <span class="leaderboard-name">${entry.name}</span>
                            <span class="leaderboard-score">${entry.score}</span>
                        </div>
                    `;
                });
            }
            
            leaderboardHtml += '</div>';
            return leaderboardHtml;
        }

        function showNameInputOverlay() {
            overlay.innerHTML = `
                <h1>GAME OVER!</h1>
                <p style="margin-top: 10px; font-size: 18px; color: #4CAF50;">Score: ${score}</p>
                <div id="name-input-container">
                    <input type="text" id="player-name" placeholder="Enter your name" maxlength="20">
                    <button class="small-button" id="submitNameBtn">SUBMIT SCORE</button>
                </div>
                ${displayLeaderboard()}
                <div id="button-container">
                    <button class="small-button" id="playAgainBtn">PLAY AGAIN</button>
                </div>
            `;
            overlay.style.display = "flex";

            document.getElementById("submitNameBtn").addEventListener('click', submitScore);
            document.getElementById("player-name").addEventListener('keypress', (e) => {
                if (e.key === "Enter") submitScore();
            });
            document.getElementById("playAgainBtn").addEventListener('click', startGame);
            
            // Focus on input for better UX
            setTimeout(() => document.getElementById("player-name").focus(), 100);
        }

        function submitScore() {
            const nameInput = document.getElementById("player-name");
            const name = nameInput.value.trim() || "Player";
            
            addHighScore(name, score);
            
            // Show updated leaderboard
            overlay.innerHTML = `
                <h1>SCORE SAVED!</h1>
                <p style="margin-top: 10px; font-size: 18px; color: #4CAF50;">Score: ${score}</p>
                ${displayLeaderboard()}
                <div id="button-container">
                    <button id="playAgainBtn">PLAY AGAIN</button>
                </div>
            `;
            
            document.getElementById("playAgainBtn").addEventListener('click', startGame);
        }

        function startGame() {
            score = 0;
            scoreElement.innerHTML = "Score: 0";
            snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
            dx = 0;
            dy = -1;
            nextDx = 0;
            nextDy = -1;
            
            createFood();
            overlay.style.display = "none";
            gameRunning = true;
            clearTimeout(gameLoopTimeout);
            main();
        }

        function main() {
            if (!gameRunning) return;

            if (didGameEnd()) {
                showGameOver();
                return;
            }

            gameLoopTimeout = setTimeout(() => {
                if (nextDx !== 0 || nextDy !== 0) {
                    dx = nextDx;
                    dy = nextDy;
                }
                
                clearCanvas();
                drawFood();
                advanceSnake();
                drawSnake();
                main();
            }, 100);
        }

        function clearCanvas() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = (index === 0) ? "#4CAF50" : "#81C784";
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function advanceSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);

            if (snake[0].x === food.x && snake[0].y === food.y) {
                score += 10;
                scoreElement.innerHTML = "Score: " + score;
                createFood();
            } else {
                snake.pop();
            }
        }

        function didGameEnd() {
            const head = snake[0];
            const hitWall = head.x < 0 || head.x >= (canvas.width / gridSize) || head.y < 0 || head.y >= (canvas.height / gridSize);
            const hitSelf = snake.slice(1).some(part => part.x === head.x && part.y === head.y);
            return hitWall || hitSelf;
        }

        function showGameOver() {
            gameRunning = false;
            showNameInputOverlay();
        }

        function createFood() {
            food.x = Math.floor(Math.random() * (canvas.width / gridSize));
            food.y = Math.floor(Math.random() * (canvas.height / gridSize));
        }

        function drawFood() {
            // Draw Modo logo if loaded, otherwise draw red square
            if (logoLoaded) {
                try {
                    ctx.drawImage(logoSvg, food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
                } catch (e) {
                    // Fallback to red square if drawing fails
                    ctx.fillStyle = "#E63946";
                    ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
                }
            } else {
                // Draw red square as fallback
                ctx.fillStyle = "#E63946";
                ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
            }
        }

        // Touch Controls
        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, false);

        document.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            handleSwipe(touchEndX - touchStartX, touchEndY - touchStartY);
        }, false);

        function handleSwipe(x, y) {
            const minSwipeLen = 30;
            if (Math.abs(x) > Math.abs(y)) {
                if (Math.abs(x) < minSwipeLen) return;
                if (x > 0 && dx === 0) { nextDx = 1; nextDy = 0; }
                else if (x < 0 && dx === 0) { nextDx = -1; nextDy = 0; }
            } else {
                if (Math.abs(y) < minSwipeLen) return;
                if (y > 0 && dy === 0) { nextDx = 0; nextDy = 1; }
                else if (y < 0 && dy === 0) { nextDx = 0; nextDy = -1; }
            }
        }

        // Keyboard Controls
        document.addEventListener('keydown', (e) => {
            if (e.key === "ArrowUp" && dy === 0) { nextDx = 0; nextDy = -1; }
            if (e.key === "ArrowDown" && dy === 0) { nextDx = 0; nextDy = 1; }
            if (e.key === "ArrowLeft" && dx === 0) { nextDx = -1; nextDy = 0; }
            if (e.key === "ArrowRight" && dx === 0) { nextDx = 1; nextDy = 0; }
        });

        // Initialize overlay with start button and leaderboard
        function initializeOverlay() {
            overlay.innerHTML = `
                <h1>Modo Snake Game</h1>
                ${displayLeaderboard()}
                <button id="startBtn">START GAME</button>
            `;
            const newStartBtn = document.getElementById("startBtn");
            newStartBtn.addEventListener('click', startGame);
        }

        initializeOverlay();
    </script>
</body>
</html>
