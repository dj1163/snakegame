<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>University Snake</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
            color: white;
        }
        #game-container {
            position: relative;
            width: 90vw;
            max-width: 400px;
            aspect-ratio: 1 / 1;
        }
        canvas {
            width: 100%;
            height: 100%;
            background-color: #000;
            border: 2px solid #555;
            display: block;
        }
        #score-board {
            margin-bottom: 10px;
            font-size: 24px;
        }
        /* Overlay for the Start/Game Over screen */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        button {
            padding: 15px 30px;
            font-size: 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:active {
            background-color: #3e8e41;
        }
    </style>
</head>
<body>

    <div id="score-board">Score: 0</div>
    
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="overlay">
            <h1>University Snake</h1>
            <button id="startBtn">Start Game</button>
        </div>
    </div>

    <p style="font-size: 12px; margin-top: 10px;">Swipe to move</p>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score-board");
        const overlay = document.getElementById("overlay");
        const startBtn = document.getElementById("startBtn");

        // CONFIGURATION
        const gridSize = 20; // Internal logical units
        canvas.width = 400;  // Resolution (Internal)
        canvas.height = 400;

        let score = 0;
        let snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
        let food = {x: 5, y: 5};
        let dx = 0;
        let dy = -1;
        let nextDx = 0;
        let nextDy = -1;
        let gameRunning = false;

        // UNIVERSITY ICON
        const uniIcon = new Image();
        // Replace the URL below with your University's Logo (PNG with transparent background works best)
        uniIcon.src = "https://upload.wikimedia.org/wikipedia/en/thumb/3/3a/Harvard_University_coat_of_arms.svg/200px-Harvard_University_coat_of_arms.svg.png"; 

        // GAME LOOP
        function main() {
            if (!gameRunning) return;

            if (didGameEnd()) {
                gameRunning = false;
                showGameOver();
            }

            setTimeout(function onTick() {
                if (gameRunning) {
                    clearCanvas();
                    drawFood();
                    advanceSnake();
                    drawSnake();
                    main();
                }
            }, 100);
        }

        function clearCanvas() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#4CAF50" : "#81C784"; // Head is darker green
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function advanceSnake() {
            dx = nextDx;
            dy = nextDy;
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);

            if (snake[0].x === food.x && snake[0].y === food.y) {
                score += 10;
                scoreElement.innerHTML = "Score: " + score;
                createFood();
            } else {
                snake.pop();
            }
        }

        function didGameEnd() {
            const head = snake[0];
            const hitWall = head.x < 0 || head.x >= canvas.width / gridSize || head.y < 0 || head.y >= canvas.height / gridSize;
            const hitSelf = snake.slice(1).some(part => part.x === head.x && part.y === head.y);
            return hitWall || hitSelf;
        }

        function createFood() {
            food.x = Math.floor(Math.random() * (canvas.width / gridSize));
            food.y = Math.floor(Math.random() * (canvas.height / gridSize));
        }

        function drawFood() {
            // Draw the University Icon instead of a circle
            if (uniIcon.complete) {
                ctx.drawImage(uniIcon, food.x * gridSize, food.y * gridSize, gridSize, gridSize);
            } else {
                ctx.fillStyle = "red";
                ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);
            }
        }

        function resetGame() {
            score = 0;
            scoreElement.innerHTML = "Score: 0";
            snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
            nextDx = 0; nextDy = -1;
            dx = 0; dy = -1;
            createFood();
        }

        function startGame() {
            resetGame();
            gameRunning = true;
            overlay.style.display = "none";
            main();
        }

        function showGameOver() {
            overlay.style.display = "flex";
            overlay.innerHTML = `<h1>Game Over!</h1><p>Score: ${score}</p><button id="restartBtn">Play Again</button>`;
            document.getElementById("restartBtn").addEventListener("click", startGame);
        }

        // TOUCH CONTROLS (Swipe Detection)
        let touchStartX = 0;
        let touchStartY = 0;

        window.addEventListener('touchstart', e => {
            if (gameRunning) {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }
        }, false);

        window.addEventListener('touchend', e => {
            if (gameRunning) {
                let touchEndX = e.changedTouches[0].screenX;
                let touchEndY = e.changedTouches[0].screenY;
                handleSwipe(touchEndX - touchStartX, touchEndY - touchStartY);
            }
        }, false);

        function handleSwipe(x, y) {
            if (Math.abs(x) > Math.abs(y)) {
                if (x > 0 && dx === 0) { nextDx = 1; nextDy = 0; } // Right
                else if (x < 0 && dx === 0) { nextDx = -1; nextDy = 0; } // Left
            } else {
                if (y > 0 && dy === 0) { nextDx = 0; nextDy = 1; } // Down
                else if (y < 0 && dy === 0) { nextDx = 0; nextDy = -1; } // Up
            }
        }

        // START SCREEN
        createFood();
        startBtn.addEventListener("click", startGame);
    </script>
</body>
</html>
