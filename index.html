<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>University Snake</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            touch-action: none; /* Prevents screen bouncing on mobile */
        }
        #game-container {
            position: relative;
            width: 90vw;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        canvas {
            width: 100%;
            height: 100%;
            background-color: #000;
            display: block;
        }
        #score-board {
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: bold;
        }
        /* START/GAME OVER OVERLAY */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
        }
        h1 { margin-bottom: 20px; font-size: 32px; }
        button {
            padding: 15px 40px;
            font-size: 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px #2e6031;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px #2e6031;
        }
    </style>
</head>
<body>

    <div id="score-board">Score: 0</div>
    
    <div id="game-container">
        <div id="overlay">
            <h1 id="status-text">University Snake</h1>
            <button onclick="startGame()">START GAME</button>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <p style="font-size: 14px; margin-top: 15px; color: #888;">Swipe to turn the snake</p>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score-board");
        const overlay = document.getElementById("overlay");
        const statusText = document.getElementById("status-text");

        // SETTINGS
        const gridSize = 20; 
        canvas.width = 400;  
        canvas.height = 400;

        let score = 0;
        let snake = [];
        let food = {x: 0, y: 0};
        let dx = 0;
        let dy = 0;
        let nextDx = 0;
        let nextDy = 0;
        let gameRunning = false;
        let gameLoopTimeout;

        // LOAD UNIVERSITY ICON (optional - will use red square as fallback)
        const uniIcon = new Image();
        uniIcon.src = "https://upload.wikimedia.org/wikipedia/en/thumb/3/3a/Harvard_University_coat_of_arms.svg/200px-Harvard_University_coat_of_arms.svg.png";

        function startGame() {
            // Reset Variables
            score = 0;
            scoreElement.innerHTML = "Score: 0";
            snake = [
                {x: 10, y: 10},
                {x: 10, y: 11},
                {x: 10, y: 12}
            ];
            // Start by moving UP
            dx = 0; dy = -1;
            nextDx = 0; nextDy = -1;
            
            createFood();
            overlay.style.display = "none";
            gameRunning = true;
            
            // Clear any existing loops before starting a new one
            clearTimeout(gameLoopTimeout);
            main();
        }

        function main() {
            if (!gameRunning) return;

            if (didGameEnd()) {
                showGameOver();
                return;
            }

            gameLoopTimeout = setTimeout(function onTick() {
                // Update direction only if the player has input a new direction
                if (nextDx !== 0 || nextDy !== 0) {
                    dx = nextDx;
                    dy = nextDy;
                }
                
                clearCanvas();
                drawFood();
                advanceSnake();
                drawSnake();
                main();
            }, 100); // Speed: lower is faster
        }

        function clearCanvas() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = (index === 0) ? "#4CAF50" : "#81C784";
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function advanceSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);

            if (snake[0].x === food.x && snake[0].y === food.y) {
                score += 10;
                scoreElement.innerHTML = "Score: " + score;
                createFood();
            } else {
                snake.pop();
            }
        }

        function didGameEnd() {
            const head = snake[0];
            const hitWall = head.x < 0 || head.x >= (canvas.width / gridSize) || head.y < 0 || head.y >= (canvas.height / gridSize);
            const hitSelf = snake.slice(1).some(part => part.x === head.x && part.y === head.y);
            return hitWall || hitSelf;
        }

        function showGameOver() {
            gameRunning = false;
            statusText.innerHTML = "GAME OVER!<br>Score: " + score;
            overlay.style.display = "flex";
        }

        function createFood() {
            food.x = Math.floor(Math.random() * (canvas.width / gridSize));
            food.y = Math.floor(Math.random() * (canvas.height / gridSize));
            // Make sure food doesn't spawn on snake body
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) createFood();
            });
        }

        function drawFood() {
            // Draw a red square as food (reliable fallback)
            ctx.fillStyle = "#FF6B6B";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        // SWIPE CONTROLS
        let touchStartX = 0;
        let touchStartY = 0;

        window.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: false});

        window.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            handleSwipe(touchEndX - touchStartX, touchEndY - touchStartY);
        }, {passive: false});

        function handleSwipe(x, y) {
            const minSwipeLen = 30; // ignore small accidental taps
            if (Math.abs(x) > Math.abs(y)) {
                if (Math.abs(x) < minSwipeLen) return;
                if (x > 0 && dx === 0) { nextDx = 1; nextDy = 0; } // Right
                else if (x < 0 && dx === 0) { nextDx = -1; nextDy = 0; } // Left
            } else {
                if (Math.abs(y) < minSwipeLen) return;
                if (y > 0 && dy === 0) { nextDx = 0; nextDy = 1; } // Down
                else if (y < 0 && dy === 0) { nextDx = 0; nextDy = -1; } // Up
            }
        }
        
        // Keyboard support for desktop testing
        window.addEventListener('keydown', e => {
            if (e.key === "ArrowUp" && dy === 0) { nextDx = 0; nextDy = -1; }
            if (e.key === "ArrowDown" && dy === 0) { nextDx = 0; nextDy = 1; }
            if (e.key === "ArrowLeft" && dx === 0) { nextDx = -1; nextDy = 0; }
            if (e.key === "ArrowRight" && dx === 0) { nextDx = 1; nextDy = 0; }
        });

    </script>
</body>
</html>
